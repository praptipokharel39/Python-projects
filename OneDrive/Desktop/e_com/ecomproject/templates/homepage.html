<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">ECOM</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo02" aria-controls="navbarTogglerDemo02" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarTogglerDemo02">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{%url "ecomapp:home"%}">Store</a>
              </li>

              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{%url "ecomapp:customer"%}">Register</a>
              </li>

              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{%url "ecomapp:mycart"%}">Cart🛒</a>
              </li>
             
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{%url "ecomapp:category"%}">Category</a>
              </li>
            </ul>
            <form class="d-flex" role="search">
              <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
              <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
          </div>
        </div>
      </nav>
      
      {% block content %}
        <div class = "row mt-3">
          
              {% for p in product_list%}
                  <div class ="col-md-4 ">
                    <a href = "{% url 'ecomapp:productdetails' p.slug %}">
                      <img src = {{p.image.url}} alt="" width =200 height=300 class ="mx-5" >
                    </a>
                       <h6 class = "mx-5 mt-2">{{p.title}}</h3>
                       <p class="mt-3 mx-5"><b>Price: </b><strike>Rs.{{p.marked_price}}</strike>Rs.{{p.selling_price}}
                          <br>
                          <b>Warrenty Period:</b>{{p.warrenty}}
                          <br>
                          <b>Return Policy:</b>{{p.return_policy}}
                          <br>
                          <b>Items Available:</b>{{p.view_count}}
                          <br>
                          <a href="{%url "ecomapp:cart" p.id %}"  class="btn btn-primary m-2 " > Add to Cart </a>
                       </p>
                  </div>
              {%endfor%}
          </div>
      {%endblock%}
</body>
</html>
