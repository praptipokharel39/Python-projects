{%extends "homepage.html" %}

{%block content%}

    <div class="container">
        <h3>All Products</h3>
        {%for cat in allcategories%}
            <h4>{{cat.title}}</h4>

            <div class="row">
                {%for p in cat.product_set.all %}
                    <div class="col-md-3">
                        <div class="m-4">
                            <img src={{p.image.url}} height=100 class="mx-5">
                            <h6 class = "mx-5 mt-2">{{p.title}}</h6>
                            <p class="mt-3 mx-5"><b>Price: </b><strike>Rs.{{p.marked_price}}</strike>Rs.{{p.selling_price}}
                           
                           <a href="/about/"  class="btn btn-primary m-2 " > Add to Cart </a>
                            </p>


                        </div>
                    </div>
                {% endfor %}

            
            </div>
        {%endfor%}
    </div>

{%  endblock %}
